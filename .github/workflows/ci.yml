name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --all-groups --python 3.14
      - run: uv run --python 3.14 pytest tests
      - if: matrix.os == 'ubuntu-latest'
        run: make size-check
      - if: matrix.os == 'ubuntu-latest'
        run: uv run ruff check katana tests examples
      - if: matrix.os == 'ubuntu-latest'
        run: uv run ruff format --check katana tests examples
      - if: matrix.os == 'ubuntu-latest'
        run: uv run mypy katana

  node-bridges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check katana/ast_bridge.mjs
      - run: node --check katana/ast_bridge_modules.mjs
      - run: npm run test:markdown-bridge

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv build
      - run: uvx twine check dist/*
