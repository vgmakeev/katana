name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --all-groups --python 3.14
      - run: uv run --python 3.14 pytest tests
      - if: matrix.os == 'ubuntu-latest'
        run: make size-check
      - if: matrix.os == 'ubuntu-latest'
        run: uv run ruff check katana tests examples
      - if: matrix.os == 'ubuntu-latest'
        run: uv run ruff format --check katana tests examples
      - if: matrix.os == 'ubuntu-latest'
        run: uv run mypy katana

  node-bridges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check katana/ast_bridge.mjs
      - run: node --check katana/ast_bridge_modules.mjs
      - run: npm run test:markdown-bridge

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - run: uvx twine check dist/*
